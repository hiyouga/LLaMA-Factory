model: Qwen/Qwen3-0.6B
model_class: llm

template: qwen3_nothink

kernel_config: null

quant_config: null

# Muon 的 Newton-Schulz 在 FSDP2 的 DTensor 分片上做会发散 -> NaN，
# 因此 Muon step 已做 DTensor 感知（v2）：all-gather 全量梯度 -> 完整矩阵 NS ->
# scatter 回本地分片。可在 fsdp2 下使用，代价是每步多一次 all-gather+scatter，
# 且 momentum buffer 按全量存（显存翻倍）。
dist_config:
  name: fsdp2

optim_config:
  name: muon
  wd: 0.1
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_muon
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-5
max_steps: 10

### sample
sample_backend: hf
max_new_tokens: 128
