model: Qwen/Qwen3-0.6B
model_class: llm

kernel_config:
  name: auto
  include_kernels: auto

quant_config: null

# Multi-Token Prediction (MTP): append K extra prediction heads to the model.
# `num_layers` is the number of MTP heads (K); `loss_scale` weights the MTP loss
# in the total loss (total = lm_loss + loss_scale * mtp_loss).
mtp_config:
  name: mtp
  num_layers: 1
  loss_scale: 0.3

dist_config:
  name: fsdp2
  dcp_path: null

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_mtp_fsdp2
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 10

### sample
sample_backend: hf
max_new_tokens: 128
