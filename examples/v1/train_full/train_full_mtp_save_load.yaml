### MTP weight save/load — final export (path A)
#
# Verifies the `save_model` path (HF-format export at the end of training). Before the
# Q2 fix this raised `RuntimeError: shared tensors [{'model.embed_tokens.weight',
# 'mtp.embed_tokens.weight'}] not properly defined`; after the fix it exports cleanly and
# `mtp.*` weights can be reloaded.
#
# Run:
#   USE_V1=1 llamafactory-cli train examples/v1/train_full/train_full_mtp_save_load.yaml
# Then verify the reload:
#   PYTHONPATH=src python scripts/verify_mtp_save_load_e2e.py \
#       --output_dir outputs/test_mtp_save_load --mtp_num_layers 1 --mtp_loss_scale 0.3
#
# Qwen3-0.6B is all `full_attention`, so this exercises the save/load path (not the
# hybrid-attention layer selection — use a Qwen3.5 model for that). No flash-attn needed
# (single-GPU FSDP2, no CP).

model: Qwen/Qwen3-0.6B
model_class: llm

# Multi-Token Prediction: 1 head, loss_scale weights the MTP loss
# (total = lm_loss + loss_scale * mtp_loss). `mtp_loss` is logged each logging_steps.
mtp_config:
  name: mtp
  num_layers: 1
  loss_scale: 0.3

dist_config:
  name: fsdp2
  dcp_path: null

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_mtp_save_load
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 10
