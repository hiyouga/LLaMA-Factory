model: Qwen/Qwen3-0.6B
model_class: llm

# MTP + Context Parallelism (Ulysses). CP requires `dist_config.name: fsdp2` and
# `flash_attn: flash_attention_2`. Each MTP head's loss is reduced across the CP
# group by all-gathering labels / loss_weights / log-probs (see
# `sequence_parallel_mtp_loss`).
mtp_config:
  name: mtp
  num_layers: 1
  loss_scale: 0.3

flash_attn: flash_attention_2

dist_config:
  name: fsdp2
  dcp_path: null
  cp_mode: ulysses
  cp_size: 2

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_mtp_ulysses_cp
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
bf16: false
max_steps: 10
