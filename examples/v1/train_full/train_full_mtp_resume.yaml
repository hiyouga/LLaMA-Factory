### MTP weight save/load — checkpoint resume (path B)
#
# Verifies the `save_checkpoint` / `resume` path (DCP format, mid-training snapshot).
# DCP stores mtp.* by FQN (no shared-tensor issue), and `load_checkpoint` restores them.
# Success criterion: after resume, `loss` AND `mtp_loss` continue smoothly from where
# training was interrupted (no jump back to a high initial loss).
#
# --- Step 1: train to step 10, snapshot to checkpoint-10, then keep going to step 20 ---
#   USE_V1=1 llamafactory-cli train examples/v1/train_full/train_full_mtp_resume.yaml
#   # Produces: outputs/test_mtp_resume/checkpoint-10/  (model/ optimizer/ scheduler.pt ...)
#   # Note the loss & mtp_loss around step 10 (the snapshot point) and step 11+.
#
# --- Step 2: resume from checkpoint-10 and re-run to step 20 ---
#   # Uncomment the `resume_from_checkpoint` line below, then:
#   USE_V1=1 llamafactory-cli train examples/v1/train_full/train_full_mtp_resume.yaml
#   # Step 11's loss & mtp_loss must match step 10's (continuity => mtp + optimizer restored).
#
# IMPORTANT: keep `mtp_config` identical between the two runs — a different num_layers /
# loss_scale makes the grafted MTP structure mismatch the checkpoint FQNs.
#
# No flash-attn needed (single-GPU FSDP2, no CP).

model: Qwen/Qwen3-0.6B
model_class: llm

mtp_config:
  name: mtp
  num_layers: 1
  loss_scale: 0.3

dist_config:
  name: fsdp2
  dcp_path: null

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_mtp_resume
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 20
save_steps: 10          # snapshot a DCP checkpoint at step 10
# save_ckpt_as_hf: true  # optional: also save an HF-format copy under checkpoint-10/hf_model
                          # (exercises the Q2 strip on the checkpoint HF path too)

### resume (uncomment for step 2)
# resume_from_checkpoint: outputs/test_mtp_resume/checkpoint-10
# resume_from_checkpoint: auto   # auto-picks the latest checkpoint-* in output_dir
