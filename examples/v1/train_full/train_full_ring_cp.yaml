model: Qwen/Qwen3-0.6B
trust_remote_code: true
model_class: llm

template: qwen3_nothink

# FSDP Config
dist_config:
  name: fsdp2
  dcp_path: null
  cp_mode: ring # choice: ring/ring_zigzag
  cp_size: 2

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_ring_cp
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
bf16: true
max_steps: 10
flash_attn: flash_attention_2
