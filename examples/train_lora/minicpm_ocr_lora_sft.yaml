### Run scripts/prepare_minicpm_ocr_mock.py first; replace the dataset for real training.
model_name_or_path: /user/zhangxun/models/MiniCPM-OCR-1.0
trust_remote_code: false
flash_attn: sdpa

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true

dataset_dir: output/minicpm_ocr_mock
dataset: minicpm_ocr_mock
template: minicpm_ocr
enable_thinking: false
cutoff_len: 2048
packing: false
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

output_dir: output/minicpm_ocr_lora_mock
logging_steps: 1
save_strategy: steps
save_steps: 2
save_total_limit: 1
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 2
bf16: true
lr_scheduler_type: constant
